name: Landing CI

on:
  pull_request:
    branches:
      - app
      - stage
      - main
  push:
    branches:
      - app
      - stage
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-flow:
    name: Enforce app to stage to main flow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check allowed pull request direction
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          case "$BASE_BRANCH:$HEAD_BRANCH" in
            stage:app|main:stage)
              if [[ -z "$HEAD_REPOSITORY" || "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
                echo "Rejected promotion from an untrusted repository: $HEAD_REPOSITORY"
                exit 1
              fi
              echo "Allowed promotion: $HEAD_BRANCH -> $BASE_BRANCH"
              ;;
            app:feature/*|app:fix/*|app:hotfix/*)
              echo "Allowed feature integration: $HEAD_BRANCH -> app"
              ;;
            *)
              echo "Rejected pull request direction: $HEAD_BRANCH -> $BASE_BRANCH"
              echo "Use feature/* -> app, app -> stage, then stage -> main."
              exit 1
              ;;
          esac

  build:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PLATFORM_API_URL: ${{ vars.VITE_PLATFORM_API_URL || secrets.VITE_PLATFORM_API_URL }}

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  secret-scan:
    name: Scan git history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Setup Go for Gitleaks CLI
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.11'
          cache: false

      - name: Scan all Git history with redacted output
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --log-opts="--all" --redact --no-banner --exit-code 1 .

  codeql:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066

  stage-artifact:
    name: Package stage preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/stage'
    needs:
      - build
      - secret-scan
      - codeql
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build stage bundle
        run: npm ci && npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PLATFORM_API_URL: ${{ vars.VITE_PLATFORM_API_URL || secrets.VITE_PLATFORM_API_URL }}

      - name: Upload stage bundle for review
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cispar-landing-stage-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy-gcp-stage:
    name: Deploy stage to Google Cloud Run
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/stage' &&
      vars.GCP_PROJECT_ID != '' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
      vars.GCP_SERVICE_ACCOUNT != '' && vars.GCP_RUNTIME_SERVICE_ACCOUNT != ''
    needs:
      - build
      - secret-scan
      - codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Prepare frontend build configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PLATFORM_API_URL: ${{ vars.VITE_PLATFORM_API_URL || secrets.VITE_PLATFORM_API_URL }}
        run: |
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; const keys = ["VITE_SUPABASE_URL", "VITE_SUPABASE_ANON_KEY", "VITE_PLATFORM_API_URL"]; const config = Object.fromEntries(keys.filter((key) => process.env[key]).map((key) => [key, process.env[key]])); writeFileSync(`${process.env.RUNNER_TEMP}/cispar-build-env.json`, JSON.stringify(config));'

      - name: Deploy stage service
        run: >-
          gcloud run deploy cispar-landing-stage
          --source .
          --build-env-vars-file "$RUNNER_TEMP/cispar-build-env.json"
          --project "$GCP_PROJECT_ID"
          --region "$GCP_REGION"
          --platform managed
          --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT"
          --allow-unauthenticated
          --min 0
          --max 1
          --concurrency 10
          --cpu 1
          --memory 512Mi
          --timeout 30s
          --quiet

      - name: Show deployed stage URL
        run: gcloud run services describe cispar-landing-stage --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)'
